openapi: 3.0.0
info:
  title: 금융 AI Agent API
  description: |
    은행(V1) 및 증권(V2) 기능을 위한 API 명세서.

    ⚠️ 이 문서는 내부(사용자 대상) API만 다룬다. 외부 회사(MaintQ·InsuQ)와의
    A2A 연동 계약은 별도 문서다 — `docs/A2A_CONTRACTS.md`(이 레포 관점 요약) +
    `docs/A2A_IDENTITY.md`(신원 식별 조사, 원본) + A2A_Q 레포 `docs/schemas/`(스키마 원본).
    아직 M1(계약 계층) 초안 단계이며 이 openapi.yml에는 반영되지 않았다.
  version: "1.0.0"
servers:
  - url: /api/v1
    description: API V1

paths:
  # --- 인증 ---
  /auth/login:
    post:
      summary: 로그인
      description: |
        TASK-116 — 계정 열거(user enumeration) 차단. 이메일 미존재와 비밀번호 불일치를
        **완전히 같은 401 응답**(`code`·`message` 동일)으로 통일한다. 로그인 경로에서
        404는 나오지 않는다(계정 존재 여부가 상태코드·본문 어느 쪽으로도 새어나가지 않는다).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: 로그인 성공 — Access Token은 응답 본문, Refresh Token은 HttpOnly 쿠키로 내려간다
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum: ["USER", "ADMIN", "MANAGER"]
        '400':
          description: 요청 형식 오류(`COMMON_400`) — 이메일 형식이 아니거나 필수값 누락(`@Valid`)
        '401':
          description: |
            로그인 실패(`AUTH_401`) — 이메일이 존재하지 않거나 비밀번호가 일치하지 않는 경우
            **둘 다 이 응답 하나로 통일된다**(계정 열거 차단). 응답 본문은 다음과 완전히 동일하다:
            `{"code": "AUTH_401", "message": "이메일 또는 비밀번호가 일치하지 않습니다."}`

  # --- V1: 은행 핵심 ---
  /sms/classify:
    post:
      summary: 스미싱 문자 분류
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsClassifyRequest'
      responses:
        '200':
          description: 분류 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsClassifyResponse'

  /loans/simulate:
    post:
      summary: 대출/금리 시뮬레이션
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanSimulationRequest'
      responses:
        '200':
          description: 시뮬레이션 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanSimulationResponse'

  /reports/health-check:
    get:
      summary: 금융 건강검진 리포트 조회
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 최신 건강검진 리포트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckReport'

  /fds/score:
    post:
      summary: FDS 위험 점수 계산
      description: 송금 승인 직전 거래 맥락을 받아 위험 점수와 조치 권고안을 제공합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FdsScoreRequest'
      responses:
        '200':
          description: 위험 점수 산출 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FdsScoreResponse'
        '400':
          description: 유효하지 않은 요청 본문
        '500':
          description: 내부 오류

  # --- V1: 이체 (요청 → 승인 2단계, TASK-83-B) ---
  /transfers:
    post:
      summary: 이체 요청 생성
      description: |
        출금 계좌·수취 계좌·금액을 받아 PENDING 상태의 이체 요청을 만든다. 잔액 검증과
        1회 한도(기본 5천만) 검증을 요청 시점에 수행한다. 승인 주체는 출금 계좌가 속한
        고객 유형(customer_type)에 따라 갈린다 — 개인 고객은 요청자 본인만, 기업 고객은
        같은 고객 소속 MANAGER가 승인한다(TASK-109).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: 이체 요청 생성됨 (status=PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          description: 잔액 부족(ACCOUNT_001) 또는 1회 한도 초과(TRANSFER_001)
        '403':
          description: 본인 소유가 아닌 계좌를 출금 계좌로 지정함(TRANSFER_002)
        '404':
          description: 사용자 또는 계좌를 찾을 수 없음
    get:
      summary: 내 이체 요청 목록 조회
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            description: "최대 100으로 클램프된다"
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransferStatus'
      responses:
        '200':
          description: 페이지네이션된 이체 요청 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransferListItem'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer

  /transfers/{requestId}/approve:
    post:
      summary: 이체 요청 승인
      description: |
        승인 주체는 출금 계좌가 속한 고객 유형(customer_type)에 따라 갈린다(TASK-109) —
        **개인 고객**: 요청자 본인만 승인할 수 있다(타인 승인 시 403 TRANSFER_002).
        **기업 고객**: 같은 고객 소속 MANAGER가 승인한다. 요청자 본인은 role과 무관하게
        자기 요청을 승인할 수 없고(403 TRANSFER_006 — 자기결재 금지), 같은 고객 소속이라도
        MANAGER가 아니면(USER·ADMIN) 승인할 수 없다(403 TRANSFER_007 — 결재 권한 없음).
        다른 고객 소속 사용자의 승인 시도는 role과 무관하게 403 TRANSFER_002다(테넌트 격리 —
        "권한 부족"이 아니라 "그 리소스가 안 보인다"로 취급한다). FDS 판정이 필수 관문이다 —
        ALLOW는 COMPLETED로 전이하고, BLOCK은 거부(상태를 BLOCKED로 남기고 경보 생성),
        REQUIRE_2FA는 추가 인증 요구 상태(PENDING_2FA)로 둔다. COMPLETED 전이 시
        출금 계좌 잔액을 실제로 차감한다(2026-08-09 도입).
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 승인 처리 결과 (status=COMPLETED 또는 PENDING_2FA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          description: 1일 누적 한도 초과(TRANSFER_004) 또는 실행 시점 잔액부족(TRANSFER_005)
        '403':
          description: |
            승인 권한 없음(TASK-109 — 코드 3종) 또는 FDS 차단(FDS_001).
            - `TRANSFER_002`: 소유권·테넌트 위반(개인 고객 이체를 본인이 아닌 사람이 승인,
              또는 다른 고객 소속 사용자의 승인 시도)
            - `TRANSFER_006`: 기업 고객 자기결재 금지(요청자 본인의 승인 시도)
            - `TRANSFER_007`: 기업 고객 결재 권한 없음(같은 고객 소속이지만 MANAGER가 아님)
        '404':
          description: 존재하지 않는 요청
        '409':
          description: 이미 처리된 요청(TRANSFER_003) — PENDING이 아닐 때

  /transfers/{requestId}/reject:
    post:
      summary: 이체 요청 반려(기업 모드 전용)
      description: |
        기업 고객 결재 라인의 반려 경로(TASK-110) — 승인만 있으면 부적절한 요청이 영원히
        PENDING으로 남는다. 인가 판정은 승인(/approve)과 완전히 동일한 규칙(ApprovalPolicy)을
        재사용한다 — 같은 고객 소속 MANAGER만 타인의 요청을 반려할 수 있다(자기결재 금지,
        ADMIN 비결재자). **반려는 FDS 판정을 거치지 않는다** — 위험 판정이 아니라 결재
        결정이기 때문이다. **개인 고객 이체에는 반려 경로가 없다**(403 TRANSFER_008) — 본인
        취소는 별개 기능이며 이 API의 범위가 아니다.

        반려 사유는 `reasonCode`(저카디널리티 enum, 감사 로그에 실린다)와 선택적
        `comment`(자유 텍스트)로 구성된다. `comment`는 `transfer_approval.comment`에만
        저장되고 **감사 로그에는 절대 싣지 않는다**(절대 원칙 3 — 계좌번호 등이 적힐 수 있다).
        반려된 요청은 1일 누적 한도 집계에서 제외된다(TransferLimitPolicy.DAILY_AGGREGATE_STATUSES).
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRejectRequest'
      responses:
        '200':
          description: 반려 처리 결과 (status=REJECTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          description: reasonCode 누락/오타(Bean Validation) 또는 comment 500자 초과
        '403':
          description: |
            반려 권한 없음(승인과 동일한 ApprovalPolicy 판정 재사용) 또는 개인 고객 반려 시도.
            - `TRANSFER_002`: 소유권·테넌트 위반
            - `TRANSFER_006`: 기업 고객 자기결재(반려) 금지 — 요청자 본인의 반려 시도
            - `TRANSFER_007`: 기업 고객 결재 권한 없음(같은 고객 소속이지만 MANAGER가 아님)
            - `TRANSFER_008`: 개인 고객 이체는 반려 경로가 없음(반려는 기업 모드 전용)
        '404':
          description: 존재하지 않는 요청
        '409':
          description: 이미 처리된 요청(TRANSFER_003) — PENDING이 아닐 때(동시 승인/반려 경합 포함)

  # --- V1: 결재함 (TASK-117, 기업 모드 전용 — MANAGER가 소속 타인의 요청을 조회) ---
  /transfers/approvals:
    get:
      summary: 결재 대기 목록 조회
      description: |
        기업 고객(CORPORATE) 소속 MANAGER가 **같은 고객 소속·타인이 요청한** 이체를 조회한다
        (자기결재 금지의 조회판 — 본인 요청은 목록에 뜨지 않는다). 인가는 `@PreAuthorize`가
        아니라 **쿼리 술어 자체**가 한다(테넌트 격리 + 자기 요청 제외).

        🔴 결재 권한이 없는 호출자(USER·ADMIN·개인 고객 소속·개인 고객 소속 MANAGER)는
        **403이 아니라 200 + 빈 목록**을 받는다(C78) — 결재함은 "내가 결재할 것들"이라는
        개인화된 목록이라 비어 있는 것이 정확한 답이지 권한 위반이 아니다. 실제 승인/반려
        시도는 `/transfers/{requestId}/approve`·`/reject`가 여전히 403으로 막는다(무변경).

        `status`를 지정하지 않으면 `PENDING`만 반환한다(결재함의 기본 의미가 "대기 중").
        목록에는 `comment`가 **절대 실리지 않는다**(C74-B 제약 ① — 상세에서만 마스킹 후 노출).
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            description: "최대 100으로 클램프된다"
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransferStatus'
          description: "미지정 시 PENDING만 반환"
      responses:
        '200':
          description: |
            페이지네이션된 결재 대기 목록. 결재 권한이 없는 호출자는 빈 `content`로 200을
            받는다(403이 아님, C78).
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApprovalInboxItem'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          description: 미인증

  /transfers/{requestId}/approvals:
    get:
      summary: 결재 이력 상세 조회
      description: |
        요청 1건의 결재 이력(`transfer_approval` 행 전부, `createdAt` 오름차순) + 요청 정보를
        반환한다. 인가는 `/transfers/{requestId}/approve`와 **완전히 동일한**
        `ApprovalPolicy.decide` 판정을 재사용한다. 🟡 유일한 예외 — **요청자 본인**은 자기
        요청의 결재 이력을 조회할 수 있다(자기결재 금지 TRANSFER_006은 승인 **실행**에만
        적용되고 이 **조회**에는 적용하지 않는다).

        🔴 `comment`는 서버에서 계좌번호류(하이픈 포함 8자리 이상 연속 숫자열)를 `****`로
        마스킹한 값만 담긴다(C74-B 제약 ③) — DB의 `transfer_approval.comment` 원문은 그대로
        보존된다. `isApproved`만으로 결과를 판단하지 않는다 — `reasonCode`(`FDS_BLOCKED` vs
        `MANAGER_REJECTED`)가 "왜"를 가른다(C62).
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 결재 이력 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferApprovalDetailResponse'
        '401':
          description: 미인증
        '403':
          description: |
            결재 이력 조회 권한 없음(요청자 본인이 아니고, `ApprovalPolicy.decide`도 거부).
            - `TRANSFER_002`: 다른 고객 소속(테넌트 위반) — 개인 고객 소속 타인의 조회 포함
            - `TRANSFER_007`: 같은 고객 소속이지만 MANAGER가 아님(USER·ADMIN)
        '404':
          description: 존재하지 않는 요청

  # --- V2: 증권 + 신박 기능 ---
  /portfolio/rebalance:
    post:
      summary: 포트폴리오 리밸런싱 제안
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebalanceRequest'
      responses:
        '200':
          description: 리밸런싱 제안 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebalanceResponse'

  /stocks/{ticker}/predict:
    get:
      summary: 주가 예측
      description: |
        🔴 이 경로는 2026-08-19 에 `/stocks/forecast/{ticker}` 에서 정정됐다.
        옛 경로는 초기 설계안에만 있었고 구현된 적이 없다 — 그대로 두면 없는 API 를
        광고하게 된다(A2A agent card 작성 시 특히 위험).
        실제 시그니처: `StockController.predictStockPrice(ticker, days)`.
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
            example: "005930"
        - name: days
          in: query
          description: 예측 기간(일). 구현 기본값 7.
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: 예측 결과 (`StockPredictResponse`)

  /future/timemachine:
    post:
      summary: 미래 나의 금융 타임머신
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FutureTimeMachineRequest'
      responses:
        '200':
          description: 시뮬레이션 결과 (뉴스 기사 형태)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutureTimeMachineResponse'
  
  /fees/scan:
    get:
      summary: 숨은 수수료 탐지
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 수수료 탐지 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HiddenFeeScanResult'

  # --- Admin (ADMIN 전용, 2026-08-10 문서화 — TASK-100) ---
  # --- Admin 적재 경로 (백로그 122 — 실데이터를 DB에 넣을 방법이 없던 것을 푼다) ---
  /admin/accounts:
    post:
      summary: 계좌 생성
      description: |
        ADMIN 전용. 계좌 생성 경로가 없어 계좌가 마이그레이션과 수동 psql로만 만들어지던
        것을 푼다. 응답의 계좌번호는 뒤 4자리만 남기고 마스킹된다(절대 원칙 3).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '201':
          description: 생성된 계좌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: 이미 존재하는 계좌번호이거나 요청 형식이 올바르지 않음
        '403':
          description: ADMIN이 아닌 사용자의 호출
        '404':
          description: 대상 사용자를 찾을 수 없음

  /admin/transactions/import:
    post:
      summary: 거래 CSV 적재
      description: |
        ADMIN 전용. 정제된 거래 CSV를 대상 사용자의 계좌로 적재한다. `account_ref`마다
        계좌를 하나씩 확보하며(`DEMO-` 접두사), 이미 있으면 재사용한다.

        기동 시 시드(`TransactionSeedRunner`)와 **같은 파서·같은 적재 로직**을 쓴다.
        형식 오류 행은 건너뛰고 그 수를 `skippedRows`로 돌려준다 — 조용히 삼키지 않는다.

        CSV 헤더는 `account_ref,transaction_time,amount,category,is_fraud_label,description`
        고정이다. `amount`는 **양수가 수입, 음수가 지출**이며 지출 행의 `category`는
        비어 있을 수 없다(거래 요약 집계가 이 값을 groupBy 키로 쓴다).
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: query
          required: true
          description: 계좌 소유자
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 CSV. 최대 32MB · 200,000행 · 한 줄 10,000자
      responses:
        '200':
          description: 적재 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionImportResponse'
        '400':
          description: 헤더 불일치 · 빈 파일 · 상한 초과 · 유효 행 없음
        '403':
          description: ADMIN이 아닌 사용자의 호출
        '404':
          description: 대상 사용자를 찾을 수 없음

  /admin/stock-prices/import:
    post:
      summary: 주가 시세 CSV 적재
      description: |
        ADMIN 전용. `stock_prices`에 쓰기 경로가 없어 현재 값이 전부 V3 마이그레이션에
        손으로 적힌 티커 4종 × 30일이던 것을 푼다. 예측·평가액·What-If가 모두 이 값을 읽는다.

        🔴 테이블에 `(ticker, price_date)` unique 제약이 **없다.** 그냥 넣으면 같은 날짜가
        두 줄이 되어 최신가 조회가 어느 쪽을 집을지 알 수 없게 된다. 그래서 적재 전에 기존
        키를 읽어 걸러내며, 같은 파일을 두 번 올려도 행이 늘지 않는다(`duplicateRows`로 보고).

        CSV 헤더는 `ticker,price_date,price` 고정이고 `price`는 0보다 커야 한다.

        **보유 자산(`holdings`)은 이 경로에 없다** — `POST /api/v1/portfolio`가 이미 제공한다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 CSV. 최대 32MB · 200,000행 · 한 줄 10,000자
      responses:
        '200':
          description: 적재 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPriceImportResponse'
        '400':
          description: 헤더 불일치 · 빈 파일 · 상한 초과 · 유효 행 없음
        '403':
          description: ADMIN이 아닌 사용자의 호출

  /admin/users/{userId}/role:
    put:
      summary: 사용자 권한(Role) 변경
      description: |
        ADMIN 전용. 대상 사용자의 role을 변경한다(멱등 — 동일 role 재요청 시 변경 없이
        현재 상태를 반환). 마지막 ADMIN을 강등하거나 본인의 ADMIN 권한을 스스로 강등하는
        요청은 거부한다(lockout 방지 가드레일).
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleGrantRequest'
      responses:
        '200':
          description: 변경 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleGrantResponse'
        '400':
          description: 마지막 ADMIN 강등 또는 본인 ADMIN 권한 자가 강등 시도
        '403':
          description: ADMIN이 아닌 사용자의 호출
        '404':
          description: 대상 사용자를 찾을 수 없음

  # --- Admin 고객 조회 (TASK-102, ADMIN 전용 — MANAGER는 열지 않는다, C77) ---
  /admin/customers:
    get:
      summary: 고객(Company) 목록 조회
      description: |
        ADMIN 전용. 개인/기업 고객을 유형·이름으로 검색한다. `q`는 검색 패턴이 아니라
        리터럴 검색어로 취급되어 `%`·`_`·`\`는 이스케이프 후 매칭된다. 공백만 입력하면
        전체 조회와 동일하다. 정렬은 `(createdAt DESC, companyId DESC)` 고정(V13이 지정한
        tie-breaker 계약, 페이지 간 중복·누락 방지).

        `businessRegistrationNumber`·소속 사용자 `email`은 마스킹하지 않는다 — 사업자등록번호는
        국세청 공개 정보이고 이 API는 ADMIN 전용이다(C76). 개인 고객은
        `businessRegistrationNumber`가 `null`이다.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            description: "최대 100으로 클램프된다"
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/CustomerType'
          description: "미지정 시 전체 유형"
        - name: q
          in: query
          schema:
            type: string
          description: "고객명 부분일치(대소문자 무시). 미지정/공백만 입력 시 전체 조회"
      responses:
        '200':
          description: 페이지네이션된 고객 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerSummaryResponse'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
        '400':
          description: "`type`이 CustomerType enum에 없는 값(실측: Spring 기본 바인딩 실패 처리 경로가 400을 낸다)"
        '401':
          description: 미인증
        '403':
          description: ADMIN이 아닌 사용자의 호출(USER·MANAGER 전부 — MANAGER도 이 스프린트에는 열지 않는다, C77)

  /admin/customers/{customerId}:
    get:
      summary: 고객(Company) 상세 조회
      description: |
        ADMIN 전용. 소속 사용자 목록(최대 20건)과 계좌 수를 함께 반환한다. 소속 사용자가
        21명 이상이면 20건만 담고 `usersTruncated=true`로 잘렸음을 알린다(절대 원칙 7의
        정신 — 상세도 무한정 담지 않는다). 사용자 `password`는 어떤 필드에도 없다.
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 고객 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailResponse'
        '401':
          description: 미인증
        '403':
          description: ADMIN이 아닌 사용자의 호출
        '404':
          description: 존재하지 않는 고객(COMMON_001)

# --- API 스키마 정의 (Pydantic 모델과 1:1) ---
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # V1 Schemas
    Report:
      type: object
      properties:
        report_id:
          type: string
        user_id:
          type: string
        kind:
          type: string
          example: "monthly_spending"
        period:
          type: string
          example: "2025-10"
        url:
          type: string
          description: "S3/MinIO에 저장된 PDF/CSV URL"
        status:
          type: string
          enum: ["PENDING", "DONE", "FAILED"]
        created_at:
          type: string
          format: date-time
          
    SmsClassifyRequest:
      type: object
      properties:
        user_id:
          type: string
        text:
          type: string
          example: "(광고) OOO님, 1.5% 특별금리..."

    SmsClassifyResponse:
      type: object
      properties:
        text:
          type: string
        label:
          type: string
          enum: ["normal", "smishing"]
        risk_score:
          type: number
          format: float
        risk_terms:
          type: array
          items:
            type: string
            example: "특별금리"

    LoanSimulationRequest:
      type: object
      properties:
        principal:
          type: number
          format: float
        rate:
          type: number
          format: float
        months:
          type: integer

    LoanSimulationResponse:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/LoanSimulationRequest'
        total_repayment:
          type: number
          format: float
        total_interest:
          type: number
          format: float
        monthly_payments:
          type: array
          items:
            type: object
            properties:
              month:
                type: integer
              principal_payment:
                type: number
                format: float
              interest_payment:
                type: number
                format: float
              balance:
                type: number
                format: float

    HealthCheckReport:
      type: object
      properties:
        user_id:
          type: string
        report_date:
          type: string
          format: date
        main_score:
          type: integer
          description: "종합 점수 (0-100)"
        spending_score:
          type: object
          properties:
            score: 
              type: integer
            status:
              type: string
              enum: ["good", "warning", "danger"]
        debt_score:
          type: object
          properties:
            score: 
              type: integer
            status:
              type: string
              enum: ["good", "warning", "danger"]
        investment_score:
          type: object
          properties:
            score: 
              type: integer
            status:
              type: string
              enum: ["good", "warning", "danger"]
        advice:
          type: string
          description: "AI Agent의 종합 조언"

    # V2 Schemas
    Holding:
      type: object
      properties:
        ticker:
          type: string
        qty:
          type: number
          format: float
        avg_price:
          type: number
          format: float
    
    RebalanceRequest:
      type: object
      properties:
        user_id:
          type: string
        current_holdings:
          type: array
          items:
            $ref: '#/components/schemas/Holding'
        risk_profile:
          type: string
          enum: ["conservative", "moderate", "aggressive"]

    RebalanceResponse:
      type: object
      properties:
        current_metrics:
          type: object
          properties:
            expected_return:
              type: number
              format: float
            volatility:
              type: number
              format: float
        suggested_metrics:
          type: object
          properties:
            expected_return:
              type: number
              format: float
            volatility:
              type: number
              format: float
        suggested_allocations:
          type: array
          items:
            type: object
            properties:
              ticker:
                type: string
              percentage:
                type: number
                format: float
              action:
                type: string
                example: "BUY 10 shares"

    ForecastResponse:
      type: object
      properties:
        ticker:
          type: string
        forecasts:
          type: array
          items:
            type: object
            properties:
              ds:
                type: string
                format: date
              predicted_price:
                type: number
                format: float
    
    FutureTimeMachineRequest:
      type: object
      properties:
        user_id:
          type: string
        monthly_saving:
          type: number
          format: float
        investment_style:
          type: string
          enum: ["conservative", "moderate", "aggressive"]
        future_years:
          type: array
          items:
            type: integer
            example: 5

    FutureTimeMachineResponse:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/FutureTimeMachineRequest'
        results:
          type: array
          items:
            type: object
            properties:
              year:
                type: integer
              headline:
                type: string
                example: "OOO님, 5년 후 1억 자산가 되다! 공격적 투자가 빛을 발해..."
              article_text:
                type: string
                description: "뉴스 기사 본문"
              final_assets:
                type: number
                format: float

    HiddenFeeScanResult:
      type: object
      properties:
        user_id:
          type: string
        total_fees_found:
          type: number
          format: float
        fee_count:
          type: integer
        fee_details:
          type: array
          items:
            type: object
            properties:
              ts:
                type: string
                format: date-time
              merchant:
                type: string
                example: "OO카드 해외결제"
              fee:
                type: number
                format: float

    TransferStatus:
      type: string
      enum: ["PENDING", "APPROVED", "COMPLETED", "REJECTED", "BLOCKED", "PENDING_2FA"]
      description: >
        APPROVED는 정상 흐름에서는 승인~완료 사이의 과도 상태로 즉시 COMPLETED로 전이한다.
        다만 2026-08-09부터 승인이 출금 계좌 잔액을 실제로 차감하며, 실행 시점에 잔액이
        부족하면(요청 시점 이후 다른 이체가 먼저 소진한 경우) APPROVED에 영구히 머물 수
        있다 — 이 경우 재승인은 불가하며(409) 응답의 message/approvedInsufficientBalanceNotice로
        안내한다. PENDING_2FA는 이 스프린트 범위에 후속 인증 경로가 없어 사용자가 갇히는
        막다른 상태다 — 응답의 message/pendingTwoFactorNotice로 안내한다. REJECTED는
        POST /transfers/{requestId}/reject(TASK-110, 기업 모드 전용)가 세운다 — 개인 고객
        이체에는 이 값으로 전이하는 경로가 없다.

    TransferRequest:
      type: object
      required: [fromAccountId, amount, toAccountNumber]
      properties:
        fromAccountId:
          type: integer
          format: int64
        amount:
          type: number
          format: float
          minimum: 1
          description: "1회 한도(기본 5천만, TRANSFER_SINGLE_LIMIT)보다 낮아야 한다"
        toBankCode:
          type: string
        toAccountNumber:
          type: string
          description: "숫자·하이픈 4~20자"
        memo:
          type: string
          maxLength: 100

    TransferResponse:
      type: object
      properties:
        requestId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/TransferStatus'
        message:
          type: string
          description: "PENDING_2FA일 때는 추가 인증 수단이 제공되지 않는다는 안내를 포함한다"
        requestedAt:
          type: string
          format: date-time

    RejectReason:
      type: string
      enum: ["WRONG_RECIPIENT", "AMOUNT_DISPUTE", "POLICY_VIOLATION", "OTHER"]
      description: "반려 사유 분류(TASK-110). 저카디널리티 — 감사 로그(TRANSFER_REJECT.reasonCode)에 그대로 실린다."

    TransferRejectRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          $ref: '#/components/schemas/RejectReason'
        comment:
          type: string
          maxLength: 500
          description: >
            자유 텍스트 반려 사유(선택). transfer_approval.comment에만 저장되며 감사 로그에는
            싣지 않는다(절대 원칙 3 — 계좌번호 등이 적힐 수 있다). 빈 문자열은 null과 동일하게
            취급되어 저장되지 않는다.

    TransferListItem:
      type: object
      properties:
        requestId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/TransferStatus'
        amount:
          type: number
          format: float
        maskedToAccountNumber:
          type: string
          description: "뒤 4자리만 노출 (절대 원칙 3)"
        memo:
          type: string
        createdAt:
          type: string
          format: date-time
        pendingTwoFactorNotice:
          type: string
          nullable: true
          description: "status=PENDING_2FA일 때만 채워진다"
        approvedInsufficientBalanceNotice:
          type: string
          nullable: true
          description: "status=APPROVED일 때만 채워진다(2026-08-09 추가 — 실행 시점 잔액부족으로 완료되지 못한 상태)"

    FdsScoreRequest:
      type: object
      required:
        - transaction_id
        - user_id
        - amount
        - currency
        - channel
        - occurred_at
      properties:
        transaction_id:
          type: string
        user_id:
          type: string
        amount:
          type: number
          format: float
        currency:
          type: string
          example: "KRW"
        channel:
          type: string
          enum: ["WEB", "MOBILE", "API"]
        device_id:
          type: string
          description: "디바이스 식별자 (선택)"
        access_ip:
          type: string
          description: "요청한 클라이언트 IP (선택)"
        occurred_at:
          type: string
          format: date-time
        merchant_code:
          type: string
          description: "가맹점 코드 또는 식별자"
        location:
          type: string
          description: "거래 발생 위치 (도시 또는 국가)"
        user_risk_level:
          type: string
          enum: ["LOW", "MEDIUM", "HIGH"]
        velocity_count_24h:
          type: integer
          description: "최근 24시간 동일 사용자 거래 횟수"
        historical_avg_amount:
          type: number
          format: float
          description: "평균 거래 금액"
        recent_reason_codes:
          type: array
          items:
            type: string
          description: "최근 탐지된 위험 코드 리스트"

    FdsScoreResponse:
      type: object
      required:
        - transaction_id
        - risk_score
        - action
        - reason_codes
        - explanation
        - model_version
        - review_required
      properties:
        transaction_id:
          type: string
        risk_score:
          type: number
          format: float
          description: "0~1 사이의 위험 점수"
        action:
          type: string
          enum: ["ALLOW", "REQUIRE_2FA", "BLOCK"]
        reason_codes:
          type: array
          items:
            type: string
        explanation:
          type: string
          description: "최종 권고 설명"
        model_version:
          type: string
          description: "탐지 모델 버전"
        review_required:
          type: boolean
          description: "운영자 수동 검토 필요 여부"
        recommended_steps:
          type: array
          items:
            type: string
          description: "추가로 수행해야 할 후속 조치"

    # --- 적재 경로 (백로그 122) ---
    AccountResponse:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
        maskedAccountNumber:
          type: string
          description: "뒤 4자리만 남기고 가린다. 원본은 서버에만 있다 (절대 원칙 3)"
          example: "****0001"
        balance:
          type: number
        createdAt:
          type: string
          format: date-time
          nullable: true

    AccountCreateRequest:
      type: object
      required: [userId, accountNumber]
      properties:
        userId:
          type: integer
          format: int64
          description: "계좌 소유자"
        accountNumber:
          type: string
          maxLength: 50
          pattern: "^[0-9-]+$"
          description: "숫자와 하이픈만. 자유 문자열을 받으면 마스킹 규칙이 의미를 잃는다"
        initialBalance:
          type: number
          minimum: 0
          description: "생략하면 0"

    TransactionImportResponse:
      type: object
      properties:
        accountsCreated:
          type: integer
          description: "새로 만든 계좌 수"
        accountsReused:
          type: integer
          description: "이미 있어 재사용한 계좌 수"
        transactionsImported:
          type: integer
        skippedRows:
          type: integer
          description: "형식 오류로 건너뛴 행. 0이 아니면 CSV를 확인해야 한다"

    StockPriceImportResponse:
      type: object
      properties:
        imported:
          type: integer
        duplicateRows:
          type: integer
          description: "같은 (ticker, price_date)가 이미 있어 건너뛴 행. 재적재 시 정상이다"
        skippedRows:
          type: integer
          description: "형식 오류로 건너뛴 행. 0이 아니면 CSV를 확인해야 한다"

    RoleGrantRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: ["USER", "MANAGER", "ADMIN"]
          description: "대상 사용자에게 부여할 role"

    RoleGrantResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        previousRole:
          type: string
          enum: ["USER", "MANAGER", "ADMIN"]
        currentRole:
          type: string
          enum: ["USER", "MANAGER", "ADMIN"]
        changedAt:
          type: string
          format: date-time

    # --- TASK-102: 고객(Company) 조회 ---
    CustomerType:
      type: string
      enum: ["INDIVIDUAL", "CORPORATE"]
      description: "개인/기업 구분(TASK-101) — 이체 승인 주체를 결정하는 스위치."

    CustomerSummaryResponse:
      type: object
      properties:
        customerId:
          type: integer
          format: int64
        customerType:
          $ref: '#/components/schemas/CustomerType'
        customerName:
          type: string
        businessRegistrationNumber:
          type: string
          nullable: true
          description: "기업 고객만 10자리 숫자. 개인 고객은 null(마스킹하지 않는다, C76)"
        userCount:
          type: integer
          format: int64
        accountCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    CustomerUserItem:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
          description: "마스킹하지 않는다 — ADMIN 전용(C76)"
        role:
          type: string
          enum: ["USER", "MANAGER", "ADMIN"]

    CustomerDetailResponse:
      type: object
      properties:
        customerId:
          type: integer
          format: int64
        customerType:
          $ref: '#/components/schemas/CustomerType'
        customerName:
          type: string
        businessRegistrationNumber:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        users:
          type: array
          items:
            $ref: '#/components/schemas/CustomerUserItem'
          description: "최대 20건. 21건 이상이면 usersTruncated=true와 함께 20건만 담긴다"
        usersTruncated:
          type: boolean
        accountCount:
          type: integer
          format: int64

    # --- TASK-117: 결재함(ApprovalInbox) 조회 ---
    ApprovalInboxItem:
      type: object
      description: "결재 대기 목록 항목. comment 필드가 없다(C74-B 제약 ① — 목록에는 절대 싣지 않는다)."
      properties:
        requestId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/TransferStatus'
        amount:
          type: number
          format: float
        maskedToAccountNumber:
          type: string
          description: "뒤 4자리만 노출 (절대 원칙 3, MaskingUtil.maskAccountNumber)"
        memo:
          type: string
          description: "요청자 본인이 쓴 이체 메모. 원문 그대로(마스킹 대상 아님, C79)"
        requesterUserId:
          type: integer
          format: int64
        requesterEmail:
          type: string
        createdAt:
          type: string
          format: date-time

    ApprovalReasonCode:
      type: string
      enum: ["FDS_ALLOWED", "FDS_BLOCKED", "FDS_REQUIRE_2FA", "MANAGER_REJECTED"]
      description: >
        결재 결과의 "원인" 구분(TASK-101/110). isApproved(결과)와 분리된 값 — FDS_BLOCKED와
        MANAGER_REJECTED는 둘 다 isApproved=false이지만 의미가 다르다(C62).

    ApprovalHistoryItem:
      type: object
      properties:
        approverUserId:
          type: integer
          format: int64
        approverEmail:
          type: string
        isApproved:
          type: boolean
          nullable: true
          description: "null=FDS REQUIRE_2FA(추가 인증 대기, 아직 결과 미확정)"
        reasonCode:
          $ref: '#/components/schemas/ApprovalReasonCode'
        comment:
          type: string
          nullable: true
          description: >
            반려 시 입력한 자유 텍스트(TASK-110). 🔴 서버에서 계좌번호류(하이픈 포함 8자리
            이상 연속 숫자열)를 마스킹한 값만 담긴다(C74-B 제약 ③,
            MaskingUtil.maskEmbeddedAccountNumbers) — DB 원문은 그대로 보존된다.
        createdAt:
          type: string
          format: date-time

    TransferApprovalDetailResponse:
      type: object
      properties:
        requestId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/TransferStatus'
        amount:
          type: number
          format: float
        maskedToAccountNumber:
          type: string
        memo:
          type: string
        requesterUserId:
          type: integer
          format: int64
        requesterEmail:
          type: string
        createdAt:
          type: string
          format: date-time
        history:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalHistoryItem'
          description: "createdAt 오름차순. PENDING 요청은 빈 배열(정상)"